server {
    listen 81;

    # Regex: matches exactly any of the listed URIs
    location ~ ^/(api/maze/(generate|solve|save|load)|api/cave/(generate|simulate|save|load)|api/qlearning/(train|path))$ {
        fastcgi_pass 127.0.0.1:8080;
        include fastcgi_params;
    }
	
	# Frontend page
	location / {
	    root /usr/share/nginx/html;
	    index maze.html;
	}
}
